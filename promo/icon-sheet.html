<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#101014;font-family:-apple-system,"PingFang SC",sans-serif;color:#fff;
     padding:54px 60px;display:flex;flex-direction:column;gap:40px}
.row{display:flex;align-items:flex-end;gap:44px}
.item{display:flex;flex-direction:column;gap:12px;align-items:center}
.lab{font-size:13px;opacity:.42;letter-spacing:.5px}
.panel{background:#16161b;border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:34px 40px;
       display:flex;align-items:center;gap:26px}
.tip{font-size:14px;opacity:.55;line-height:1.7}
.creamy{background:#f4f5f8;border-radius:34px;padding:60px 160px}
img{display:block}
</style></head><body>
<div class="row">
  <div class="item"><img src="../.assets/app-icon-256.png" width="240"><div class="lab">256</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="128"><div class="lab">128</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="64"><div class="lab">64</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="48"><div class="lab">48</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="32"><div class="lab">32</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="24"><div class="lab">24</div></div>
  <div class="item"><img src="../.assets/app-icon-256.png" width="16"><div class="lab">16</div></div>
</div>
<div class="panel">
  <div style="display:flex;align-items:center;gap:10px;background:#1f1f26;border-radius:8px;padding:6px 14px;">
    <img src="../.assets/tray-template.png" width="20" style="filter:invert(1)">
    <span style="font-size:13px;opacity:.85">菜单栏（深色）新增模板图标</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;background:#f2f3f7;border-radius:8px;padding:6px 14px;">
    <img src="../.assets/tray-template.png" width="20">
    <span style="font-size:13px;color:#333">菜单栏（浅色）自动反色</span>
  </div>
</div>
</body></html>
