<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="0.55" stop-color="#FFF3E3"/>
      <stop offset="1" stop-color="#FFE0BC"/>
    </linearGradient>
    <linearGradient id="page" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFB44E"/>
      <stop offset="1" stop-color="#FF870E"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9E33"/>
      <stop offset="0.34" stop-color="#F4680A"/>
      <stop offset="1" stop-color="#DC5503"/>
    </linearGradient>
    <filter id="ps" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#C25000" flood-opacity="0.30"/>
    </filter>
    <filter id="bs" x="-30%" y="-70%" width="160%" height="260%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#A63C00" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#bg)"/>
  <rect x="75" y="75" width="874" height="874" rx="209" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4"/>

  <!-- 文件 -->
  <g transform="rotate(-6 512 470)" filter="url(#ps)">
    <rect x="362" y="206" width="308" height="404" rx="40" fill="url(#page)"/>
  </g>
  <g transform="rotate(-6 512 470)" fill="#FFF1DC">
    <rect x="416" y="300" width="196" height="26" rx="13"/>
    <rect x="416" y="356" width="130" height="26" rx="13"/>
    <rect x="416" y="412" width="164" height="26" rx="13"/>
  </g>

  <!-- 搁板 -->
  <g filter="url(#bs)">
    <rect x="232" y="628" width="560" height="88" rx="44" fill="url(#board)"/>
  </g>
  <rect x="232" y="634" width="560" height="18" rx="9" fill="#FFC57F" opacity="0.72"/>
</svg>
